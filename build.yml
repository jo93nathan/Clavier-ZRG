name: Build IPA

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Installer XcodeGen
        run: brew install xcodegen

      - name: Générer le projet Xcode
        run: xcodegen generate

      - name: Compiler (sans signature)
        run: |
          xcodebuild \
            -project ZRGKeyboard.xcodeproj \
            -scheme ZRGKeyboard \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build

      - name: Créer l'IPA
        run: |
          mkdir Payload
          cp -R build/Build/Products/Release-iphoneos/ZRGKeyboard.app Payload/
          zip -qr ZRGKeyboard.ipa Payload

      - uses: actions/upload-artifact@v4
        with:
          name: ZRGKeyboard-ipa
          path: ZRGKeyboard.ipa
